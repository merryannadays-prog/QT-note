<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2F4A40">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="큐티노트">
  <title>나의 큐티노트</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500&family=Nanum+Pen+Script&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app"></main>

  <nav class="penbar" id="penbar" hidden>
    <span class="penbar-ic" aria-hidden="true"></span>
    <button class="pen" data-pen="y" aria-label="연한 노랑"><i class="dot"></i></button>
    <button class="pen" data-pen="p" aria-label="연한 핑크"><i class="dot"></i></button>
    <button class="pen" data-pen="m" aria-label="연한 민트"><i class="dot"></i></button>
    <span class="penbar-sep"></span>
    <button class="pen pen-off" data-pen="" aria-label="형광펜 끄기"></button>
  </nav>

  <div class="toast" id="toast" role="status"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <script src="js/icons.js"></script>
  <script src="js/parse.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
