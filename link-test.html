<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>두플러스 앱 열기 테스트</title>
  <style>
    body { margin: 0; padding: 24px 20px 60px; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: #f5f7f5; color: #242c29; }
    h1 { font-size: 20px; margin: 0 0 6px; }
    p { margin: 0 0 18px; font-size: 14px; line-height: 1.7; color: #5b645f; }
    a.t { display: block; margin-bottom: 10px; padding: 14px 16px; border-radius: 14px; background: #fff; color: #242c29; text-decoration: none; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
    a.t b { display: block; font-size: 16px; color: #2a867f; }
    a.t small { display: block; margin-top: 4px; font-size: 12px; color: #9aa3a0; word-break: break-all; }
  </style>
</head>
<body>
  <h1>두플러스 앱 열기 테스트</h1>
  <p>버튼을 <b>하나씩</b> 눌러 보세요. 두플러스 앱이 <b>바로 열리는 번호</b>를 알려 주시면 돼요.<br>
     아무 반응이 없거나 오류·플레이스토어가 뜨면 실패예요. 뒤로 가기로 돌아와 다음 번호를 눌러 주세요.</p>
  <div id="list"></div>

  <script>
    const PKG = 'com.duranno.durannoplus';
    // 두플러스 앱이 받아 줄 수도 있는 입구 후보 (확인되지 않은 추측)
    const tests = [
      ['웹 주소(du.plus)를 두플러스 앱으로', `intent://www.du.plus/#Intent;scheme=https;package=${PKG};end`],
      ['웹 주소(du.plus 메인)를 두플러스 앱으로', `intent://www.du.plus/?main=true#Intent;scheme=https;package=${PKG};end`],
      ['웹 주소(du.plus, www 없이)를 두플러스 앱으로', `intent://du.plus/#Intent;scheme=https;package=${PKG};end`],
      ['앱 주소 duplus://', `intent://open#Intent;scheme=duplus;package=${PKG};end`],
      ['앱 주소 durannoplus://', `intent://open#Intent;scheme=durannoplus;package=${PKG};end`],
      ['앱 주소 dplus://', `intent://open#Intent;scheme=dplus;package=${PKG};end`],
      ['앱 주소 duranno://', `intent://open#Intent;scheme=duranno;package=${PKG};end`],
      ['앱 주소 com.duranno.durannoplus://', `intent://open#Intent;scheme=${PKG};package=${PKG};end`],
      ['직접 주소 duplus://open', 'duplus://open'],
      ['직접 주소 durannoplus://open', 'durannoplus://open'],
    ];
    document.getElementById('list').innerHTML = tests.map(([name, href], i) =>
      `<a class="t" href="${href}"><b>${i + 1}. ${name}</b><small>${href}</small></a>`).join('');
  </script>
</body>
</html>
